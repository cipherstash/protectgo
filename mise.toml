[tools]
go = "1.24.4"
rust = "nightly"

[tasks.install-deps]
description = "Install dependencies"
run = [
  "echo 'Installing dependencies...'",
  "go mod tidy",
  "echo 'Ensuring cbindgen is installed...'",
  "cargo install cbindgen",
]

[tasks.build-rust]
description = "Build the Rust C library and generate headers"
run = [
  "echo 'Building Rust C library...'",
  "cd crates/protect-ffi-c && cargo build --release",
  "echo 'Generating C headers...'",
  "cd crates/protect-ffi-c && (cargo run --bin generate-headers || cbindgen --config cbindgen.toml --crate protect-ffi-c --output ../../protect_ffi.h)",
]

[tasks.build]
description = "Build everything"
depends = ["build-rust"]
run = [
  "echo 'Building Go bindings...'",
  "go build ./pkg/protect",
  "echo 'Build complete!'",
]

[tasks.test]
description = "Run tests"
depends = ["build"]
run = ["echo 'Running Go tests...'", "go test ./pkg/protect"]

[tasks.example]
description = "Build and run example"
depends = ["build"]
run = [
  "echo 'Building example...'",
  "mkdir -p bin",
  "go build -o bin/example ./examples/basic_usage.go",
  "echo 'Example built! Run with: ./bin/example'",
]

[tasks.clean]
description = "Clean build artifacts"
run = [
  "echo 'Cleaning...'",
  "cargo clean",
  "rm -f protect_ffi.h",
  "rm -rf bin/",
  "go clean",
]

[tasks.fmt]
description = "Format code"
run = ["cargo fmt", "go fmt ./..."]

[tasks.check]
description = "Run code quality checks"
run = [
  "cargo clippy --all-targets --all-features -- -D warnings",
  "go vet ./...",
]

[tasks.help]
description = "Show available tasks"
run = "mise tasks"
