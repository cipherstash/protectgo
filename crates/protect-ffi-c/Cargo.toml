[package]
name = "protect-ffi-c"
version = "0.1.0"
edition = "2021"

[lib]
name = "protect_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
cipherstash-client = "0.24.0"
cts-common = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.19"
thiserror = "1.0"
hex = "0.4"

[build-dependencies]
cbindgen = "0.26"
