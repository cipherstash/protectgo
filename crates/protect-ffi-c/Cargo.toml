[package]
name = "protect-ffi-c"
version = "0.1.0"
edition = "2021"

[lib]
name = "protect_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
cipherstash-client = { version = "=0.40.0", features = ["tokio"] }
cts-common = { version = "=0.40.0", default-features = false }
stack-profile = { version = "=0.40.0" }
stack-auth = { version = "=0.40.0" }
eql-bindings = { version = "=3.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2.0"
hex = "0.4"
once_cell = "1.20"
rust_decimal = "1.37"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
libc = "0.2"

[build-dependencies]
cbindgen = "0.26"
