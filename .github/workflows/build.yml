name: Build Libraries

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:

  # Detect what changed to optimize builds
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_rust_changed: ${{ steps.changes.outputs.rust }}
      has_go_changed: ${{ steps.changes.outputs.go }}
      has_github_changed: ${{ steps.changes.outputs.github }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect file changes
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          rust:
            - '**/*.rs'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'crates/**'
            - 'rust-toolchain.toml'
          go:
            - '**/*.go'
            - 'go.mod'
            - 'go.sum'
            - 'pkg/**'
          github:
            - '.github/workflows/**'

  # Build native libraries on each platform
  build-native-libraries:
    name: Build Native Libraries
    needs: [detect-changes]
    if: |
      always() &&
      (needs.detect-changes.outputs.has_rust_changed == 'true' || 
      (needs.detect-changes.outputs.has_go_changed == 'true') || 
       (needs.detect-changes.outputs.has_github_changed == 'true'))
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (native build)
          - platform: darwin-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            lib_file: libprotect_ffi_darwin_arm64.a

          # macOS Intel (native build)
          - platform: darwin-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            lib_file: libprotect_ffi_darwin_x64.a

          # Linux x64 musl (for Alpine and static linking)
          - platform: linux-x64-musl
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
            libc: musl
            lib_file: libprotect_ffi_linux_x64_musl.a

          # Linux x64 glibc (for Debian/Ubuntu/CentOS)
          - platform: linux-x64-gnu
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            libc: glibc
            lib_file: libprotect_ffi_linux_x64.a

          # Linux arm64 glibc (for Debian/Ubuntu/CentOS)
          - platform: linux-arm64-gnu
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            libc: glibc
            lib_file: libprotect_ffi_linux_arm64.a

          # Linux arm64 musl (for Alpine and static linking)
          - platform: linux-arm64-musl
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
            libc: musl
            lib_file: libprotect_ffi_linux_arm64_musl.a

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust_target }}-cargo
            ${{ runner.os }}-cargo

      # Linux build dependencies
      - name: Install musl tools
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      # Configure musl linking for static builds
      - name: Configure musl linking
        if: contains(matrix.rust_target, 'musl') && startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p .cargo
          echo '[target.${{ matrix.rust_target }}]' >> .cargo/config.toml
          echo 'rustflags = ["-C", "target-feature=+crt-static"]' >> .cargo/config.toml

      - name: Build library
        run: |
          cd crates/protect-ffi-c
          cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Copy library
        run: |
          # Stage only this job's freshly built archive, never the (possibly
          # stale) archives from the checkout, under its platform-specific
          # filename for direct CGO usage.
          mkdir -p dist
          cp target/${{ matrix.rust_target }}/release/libprotect_ffi.a dist/${{ matrix.lib_file }}

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-${{ matrix.platform }}
          path: dist/${{ matrix.lib_file }}
          if-no-files-found: error
          retention-days: 30

  # Commit all generated libraries at once
  commit-artifacts:
    name: Commit All Generated Libraries
    needs: [build-native-libraries]
    if: always() && needs.build-native-libraries.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      # Check out the exact commit the archives were built from, not the
      # branch head, so a branch that advanced mid-build cannot end up with
      # archives built from older source.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.sha }}

      # Each matrix job uploads exactly one uniquely named archive, so all
      # artifacts can be merged into a single directory.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: library-*
          path: temp-artifacts
          merge-multiple: true

      - name: Verify and copy artifacts to package directory
        run: |
          expected="libprotect_ffi_darwin_arm64.a libprotect_ffi_darwin_x64.a libprotect_ffi_linux_arm64.a libprotect_ffi_linux_arm64_musl.a libprotect_ffi_linux_x64.a libprotect_ffi_linux_x64_musl.a"
          for lib in $expected; do
            if [ ! -f "temp-artifacts/$lib" ]; then
              echo "::error::Missing built archive: $lib"
              exit 1
            fi
          done
          count=$(find temp-artifacts -name '*.a' | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "::error::Expected exactly 6 archives, found $count"
            find temp-artifacts -name '*.a'
            exit 1
          fi
          cp temp-artifacts/*.a pkg/protect/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Link smoke test: compiling the test binary links the freshly built
      # linux x64 gnu archive, catching missing symbols before they are
      # committed.
      - name: Verify Go bindings link against the new archives
        run: CGO_ENABLED=1 go test -c -o /dev/null ./pkg/protect

      - name: Commit and push all artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/protect/*.a
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update all platform libraries [skip ci]"
            # Explicit refspec from the built SHA: fails (non-fast-forward)
            # instead of clobbering if the branch advanced during the build.
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
